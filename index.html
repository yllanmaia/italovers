<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0A1420" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Italovers" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- So as duas que aparecem no primeiro paint: Satoshi carrega a interface
         inteira e Clash o titulo da tela. Sem preload o texto pisca no fallback
         antes de assentar, e no 4G isso e visivel.
         Caveat fica de fora de proposito: sao 73 KB pra um campo so, e disputar
         banda com o bundle atrasaria o resto. Na primeira carga a nota pessoal
         pisca uma vez; da segunda em diante o service worker ja tem tudo. -->
    <link
      rel="preload"
      href="/fonts/satoshi-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/clash-display-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Italovers</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
